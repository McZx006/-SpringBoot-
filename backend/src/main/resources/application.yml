server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/online_teaching?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.platform.entity
  configuration:
    map-underscore-to-camel-case: true

platform:
  upload-path: ${PLATFORM_UPLOAD_PATH:D:/桌面文件/实训/online-teaching-platform/runtime/upload}
